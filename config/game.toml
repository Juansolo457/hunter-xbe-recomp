# Recompiler input for default.xbe. Made from xbe_symbols with the XDK 4831 signatures standing in
# for 4361, then filled from XbSymbolDatabase's 4361 patterns (OOVPA, matched as data by a
# script; see docs/HANDOFF.md) and by reading the code. Each address says where it came from:
#   sig       xbe_symbols matched the 4831 signature bytes
#   k=<score> xbe_symbols matched by constants only, checked by eye where noted
#   oovpa <v> an XbSymbolDatabase pattern of revision <v> matched (both agree on all 46 they share)
# Names at 0 are not linked in Hunter or not found yet; the host traps if one it needs is called.
#
# The XDK 4361 layouts come from the overlay below: the SDK ships 4831 and 5849 only, and [xbe] # would look for sdk/xdk/4361/layout.toml.
includes = ["xdk/4361/layout.toml"]

[xbe]
path = "assets/default.xbe"
title = 0x56550007
entry = 0xA27C1
out = "generated/game"
partitions = 64
code_sections = [".text", "D3D", "DSOUND", "D3DX", "XGRPH", "WMADECXM", "WMADEC", "XPP"]
library = "Hunter.dll"  # <exe>.dll, which the executable delay loads

# extra entry points
[functions]

# functions the host replaces or calls by name, 0 where the image has none
