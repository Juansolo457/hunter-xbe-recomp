# Recompiler input for default.xbe. build.bat / build.sh replace this with the config xbe_symbols writes:
#   xbe_symbols assets/default.xbe sdk/xdk --library Hunter.dll --out config/game.toml
# xbe_symbols needs sdk/xdk/4361/signatures.toml, which does not exist yet: Hunter is built on XDK 4361
# (docs/FINDINGS.md) and the SDK ships 4831 and 5849. Making 4361 is milestone M0 in docs/PLAN.md.
# Names left at 0 become trapping stubs; find them in Ghidra
# (python sdk/tools/symbols/xbe2pe.py config/game.toml hunter.exe) and fill them in by hand.
[xbe]
path = "assets/default.xbe"
title = 0x56550007
entry = 0x15226D
xdk = 4361
out = "generated/game"
library = "Hunter.dll"  # <exe>.dll, which the executable delay loads
partitions = 64
code_sections = [".text", "D3D", "DSOUND", "D3DX", "XGRPH", "WMADECXM", "WMADEC", "XPP", "DOLBY"]

# Optional fixes, added by hand:
# data_ranges = [[0x00150000, 0x00150040]]  # in [xbe]: bytes in code sections that are never code, end exclusive
#
# [[hook]]                   # calls void FixSomething(X86Context& ctx, uint8_t* base), defined by the game
# at = 0x0012ABCD            # guest instruction inside a recompiled function
# call = "FixSomething"
# after = false              # true runs it after the instruction (not after jumps or ret)
# on_true = "ret"            # with on_true or on_false the hook returns bool: "ret" returns as the function's ret does,
# on_false = 0x0012AC00      # an address jumps to that instruction of the same function
#
# [[function]]               # entry the analysis missed or ran past
# at = 0x00123450
# end = 0x00123520           # optional, decode no further (exclusive)
#
# [[switch]]                 # indirect jmp whose table detection was wrong
# at = 0x00123480
# targets = [0x00123490, 0x001234A8]
#
# [abi]
# D3D_InternalRelease = ["esi"]            # argument locations in API order for a link time code generated library:
# D3D_MakeRequestedSpace = ["eax", "stack"]  # a register, or "stack" for the next stack slot
